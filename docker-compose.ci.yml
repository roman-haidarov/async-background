version: "3.8"

x-ci-build: &ci-build
  context: .
  dockerfile: Dockerfile.ci

services:
  unit:
    build: *ci-build
    command: bundle exec rspec spec/ --format documentation
    environment:
      BUNDLE_GEMFILE: Gemfile.ci
      ASYNC_BACKGROUND_SCHEDULER: "${ASYNC_BACKGROUND_SCHEDULER:-async}"
    volumes:
      - tmp-unit:/gem/tmp
    tmpfs:
      - /tmp:size=64M

  unit-itsi:
    build: *ci-build
    command: bundle exec rspec spec/ --format documentation
    environment:
      BUNDLE_GEMFILE: Gemfile.ci
      ASYNC_BACKGROUND_SCHEDULER: itsi
    volumes:
      - tmp-unit-itsi:/gem/tmp
    tmpfs:
      - /tmp:size=64M

  runtime:
    build: *ci-build
    command: bundle exec ruby bin/verify_runtime.rb
    environment:
      BUNDLE_GEMFILE: Gemfile.ci

  scenario:
    build: *ci-build
    command: bundle exec ruby ci/scenario_test.rb
    environment:
      BUNDLE_GEMFILE: Gemfile.ci
      ASYNC_BACKGROUND_SCHEDULER: "${ASYNC_BACKGROUND_SCHEDULER:-async}"
      SCENARIO_WORKERS: "3"
      SCENARIO_JOBS: "200"
      SCENARIO_TIMEOUT: "60"
    volumes:
      - tmp-scenario:/gem/tmp
    tmpfs:
      - /tmp:size=64M

  scenario-itsi:
    build: *ci-build
    command: bundle exec ruby ci/scenario_test.rb
    environment:
      BUNDLE_GEMFILE: Gemfile.ci
      ASYNC_BACKGROUND_SCHEDULER: itsi
      SCENARIO_WORKERS: "3"
      SCENARIO_JOBS: "200"
      SCENARIO_TIMEOUT: "60"
    volumes:
      - tmp-scenario-itsi:/gem/tmp
    tmpfs:
      - /tmp:size=64M

  scenario-stackprof:
    build: *ci-build
    command: bundle exec ruby ci/scenario_test.rb
    environment:
      BUNDLE_GEMFILE: Gemfile.ci
      ASYNC_BACKGROUND_SCHEDULER: "${ASYNC_BACKGROUND_SCHEDULER:-async}"
      SCENARIO_WORKERS: "3"
      SCENARIO_JOBS: "200"
      SCENARIO_TIMEOUT: "60"
      STACKPROF: "1"
      STACKPROF_DIR: /gem/tmp/stackprof
    volumes:
      - ./tmp/stackprof:/gem/tmp/stackprof
    tmpfs:
      - /tmp:size=64M

volumes:
  tmp-unit:
  tmp-unit-itsi:
  tmp-scenario:
  tmp-scenario-itsi:
