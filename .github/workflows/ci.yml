name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: "Unit & Integration tests"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: Gemfile.ci
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RSpec
        env:
          BUNDLE_GEMFILE: Gemfile.ci
        run: bundle exec rspec spec/ --format documentation --color

  scenario:
    name: "Scenario test (multi-worker fork)"
    needs: unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build CI image
        run: docker compose -f docker-compose.ci.yml build scenario-stackprof

      - name: Run scenario test
        run: |
          mkdir -p tmp/stackprof
          docker compose -f docker-compose.ci.yml run --rm scenario-stackprof

      - name: StackProf report
        if: always()
        run: |
          if [ ! -d tmp/stackprof ] || ! ls tmp/stackprof/*.txt >/dev/null 2>&1; then
            echo "no stackprof reports"
            exit 0
          fi

          {
            echo "## StackProf"
            echo
            if [ -f tmp/stackprof/ci-summary.md ]; then
              cat tmp/stackprof/ci-summary.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          for f in tmp/stackprof/*.txt; do
            echo "======== $(basename "$f") ========"
            cat "$f"
            echo
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stackprof-scenario
          path: tmp/stackprof/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
